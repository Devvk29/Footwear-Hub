name: Deploy Kothari Footwear to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run:  npm run build
        env:
              VITE_FIREBASE_API_KEY: "AIzaSyAxclLJcwvIN2NUVtrXExw--pz-mGy9rGQ"
              VITE_FIREBASE_AUTH_DOMAIN: "kothari-footwear.firebaseapp.com"
              VITE_FIREBASE_PROJECT_ID: "kothari-footwear"
              VITE_FIREBASE_STORAGE_BUCKET: "kothari-footwear.firebasestorage.app"
              VITE_FIREBASE_MESSAGING_SENDER_ID: "871163981170"
              VITE_FIREBASE_APP_ID: "1:871163981170:web:8b88b95cfd97acdd5541eb"
              VITE_OWNER_EMAIL: "973dev@gmail.com"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
